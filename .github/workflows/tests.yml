name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # The paper twin and scheduler surfaces are Windows-native (schtasks,
    # PowerShell); CI runs the suite on the platform it ships on.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      # Every version the project claims is tested. 3.11 is the floor
      # `requires-python` declares (core/inherited_blunder imports
      # typing.NotRequired, which lands in 3.11); 3.14 is what the live
      # workstation runs and what the README badge advertises; 3.12 was the
      # single leg this workflow used before the matrix.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    name: pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - name: Mirror checkout to the canonical root
        # Parts of the suite assert the doctrine that the repo lives at
        # C:\src\engine\dummy (canonical-identity gates, artifact paths).
        # The runner checks out under D:\a\..., so mirror it across.
        run: |
          New-Item -ItemType Directory -Force -Path C:\src\engine | Out-Null
          Copy-Item -Recurse -Force -Path $env:GITHUB_WORKSPACE -Destination C:\src\engine\dummy
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
          enable-cache: true
      - name: Install frozen environment
        working-directory: C:\src\engine\dummy
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}
      - name: Run suite
        # Offline-hermetic on CI: no credentials, no broker contact; the two
        # live-credential tests skip without a local .env.
        working-directory: C:\src\engine\dummy
        run: >-
          uv run --frozen python -m pytest -q --timeout=120
          --cov=dummy --cov=core --cov=kalshi --cov=live_firewall
          --cov=compliance --cov=forecasting --cov=strategies --cov=risk
          --cov=adapters --cov=proof
          --cov=model_router --cov=predator_mesh --cov=calibration --cov=autonomy
          --cov-report=term --cov-fail-under=85
