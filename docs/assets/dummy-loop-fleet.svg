<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Dummy 45-loop fleet with explicit crypto loops</title>
  <desc id="desc">The 45 scheduled jobs are grouped into heartbeat, learning, sports data and grading, health and durability, and bounded footprint bands. Dedicated and shared crypto loops are highlighted in a separate evidence lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d160f"/>
      <stop offset="1" stop-color="#17251c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#f2b63c"/>
    </marker>
    <marker id="crypto-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#42bfc7"/>
    </marker>
    <style>
      .eyebrow{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:2px;fill:#7d7150}
      .title{font:700 34px Bahnschrift,"Arial Narrow",sans-serif;fill:#e9e2ce}
      .subtitle{font:15px "Segoe UI",sans-serif;fill:#93a394}
      .band{fill:#1d3025;stroke:#455545;stroke-width:1.5}
      .band-hot{fill:#243522;stroke:#f2b63c;stroke-width:2}
      .band-crypto{fill:#172c2d;stroke:#42bfc7;stroke-width:2}
      .plane{fill:#202b1d;stroke:#7d7150;stroke-width:2}
      .count{font:700 32px Bahnschrift,"Arial Narrow",sans-serif;fill:#f2b63c}
      .label{font:700 16px Bahnschrift,"Arial Narrow",sans-serif;letter-spacing:.5px;fill:#e9e2ce}
      .copy{font:11px "Cascadia Mono",Consolas,monospace;fill:#93a394}
      .micro{font:700 10px "Cascadia Mono",Consolas,monospace;letter-spacing:1px;fill:#7d7150}
      .crypto{font:700 11px "Cascadia Mono",Consolas,monospace;fill:#67d7de}
      .truth{font:700 11px "Cascadia Mono",Consolas,monospace;fill:#7ea979}
      .deny{font:700 11px "Cascadia Mono",Consolas,monospace;fill:#df8b7e}
      .wire{fill:none;stroke:#526151;stroke-width:2}
      .wire-hot{fill:none;stroke:#f2b63c;stroke-width:2.5;marker-end:url(#arrow)}
      .wire-crypto{fill:none;stroke:#42bfc7;stroke-width:2.5;marker-end:url(#crypto-arrow)}
    </style>
  </defs>

  <rect width="1200" height="820" rx="16" fill="url(#bg)"/>
  <text class="eyebrow" x="55" y="45">DUMMY · SCHEDULED INTELLIGENCE FLEET</text>
  <text class="title" x="55" y="84">45 isolated loops—including an explicit crypto fast lane.</text>
  <text class="subtitle" x="55" y="114">Each task owns one cadence, one artifact contract, and one retry boundary. Crypto is not hidden inside “general intelligence.”</text>

  <path class="wire-hot" d="M350 205L455 265"/>
  <path class="wire-hot" d="M350 310L455 325"/>
  <path class="wire-hot" d="M350 415L455 385"/>
  <path class="wire-hot" d="M350 520L455 445"/>
  <path class="wire-hot" d="M350 625L455 505"/>
  <path class="wire" d="M745 265L845 205"/>
  <path class="wire" d="M745 325L845 310"/>
  <path class="wire" d="M745 385L845 415"/>
  <path class="wire" d="M745 445L845 520"/>
  <path class="wire" d="M745 505L845 625"/>

  <g transform="translate(55 160)">
    <rect class="band-hot" width="295" height="90" rx="9"/>
    <text class="count" x="22" y="50">8</text>
    <text class="label" x="80" y="38">HEARTBEAT</text>
    <text class="copy" x="80" y="60">Predator · Poller · Board · Monitor</text>
    <text class="crypto" x="80" y="78">includes DummyCryptoPaperTwin · 5 min</text>
  </g>
  <g transform="translate(55 265)">
    <rect class="band" width="295" height="90" rx="9"/>
    <text class="count" x="22" y="50">10</text>
    <text class="label" x="80" y="38">LEARNING + IMPROVEMENT</text>
    <text class="copy" x="80" y="60">Weights · Backtest · Tune · Research</text>
    <text class="crypto" x="80" y="78">includes CryptoHorizonEvidence · 10 min</text>
  </g>
  <g transform="translate(55 370)">
    <rect class="band" width="295" height="90" rx="9"/>
    <text class="count" x="22" y="50">18</text>
    <text class="label" x="80" y="38">SPORTS DATA + GRADING</text>
    <text class="copy" x="80" y="60">Lake × 7 · WalkForward × 7</text>
    <text class="copy" x="80" y="78">BoxScore × 3 · NFL EPA</text>
  </g>
  <g transform="translate(55 475)">
    <rect class="band" width="295" height="90" rx="9"/>
    <text class="count" x="22" y="50">5</text>
    <text class="label" x="80" y="38">HEALTH + DURABILITY</text>
    <text class="copy" x="80" y="60">Watchdog · Healer · Readiness</text>
    <text class="copy" x="80" y="78">Dashboard · DashboardSnapshot</text>
  </g>
  <g transform="translate(55 580)">
    <rect class="band" width="295" height="90" rx="9"/>
    <text class="count" x="22" y="50">4</text>
    <text class="label" x="80" y="38">BOUNDED FOOTPRINT</text>
    <text class="copy" x="80" y="60">Retention · Prune · Vacuum</text>
    <text class="copy" x="80" y="78">LogRotation · audit history preserved</text>
  </g>

  <g>
    <rect class="plane" x="455" y="180" width="290" height="510" rx="14"/>
    <text class="micro" x="600" y="215" text-anchor="middle">PERSISTED COORDINATION</text>
    <text class="label" x="600" y="245" text-anchor="middle">EVIDENCE PLANE</text>
    <line x1="490" y1="270" x2="710" y2="270" stroke="#455545"/>
    <text class="truth" x="600" y="310" text-anchor="middle">point-in-time observations</text>
    <text class="truth" x="600" y="355" text-anchor="middle">attributed probabilities</text>
    <text class="truth" x="600" y="400" text-anchor="middle">cycle receipts + abstentions</text>
    <text class="truth" x="600" y="445" text-anchor="middle">settlements + calibration</text>
    <text class="truth" x="600" y="490" text-anchor="middle">promotion dossiers</text>
    <text class="truth" x="600" y="535" text-anchor="middle">health + freshness</text>
    <text class="truth" x="600" y="580" text-anchor="middle">audit + corrections</text>
    <line x1="490" y1="610" x2="710" y2="610" stroke="#455545"/>
    <text class="count" x="600" y="650" text-anchor="middle">45</text>
    <text class="micro" x="600" y="670" text-anchor="middle">INDEPENDENT SCHEDULED JOBS</text>
  </g>

  <g transform="translate(845 160)">
    <rect class="band" width="300" height="90" rx="9"/>
    <text class="label" x="22" y="37">MARKETS + CANDIDATES</text>
    <text class="copy" x="22" y="60">fresh boards · ranked scopes</text>
    <text class="copy" x="22" y="78">capital velocity · explicit abstentions</text>
  </g>
  <g transform="translate(845 265)">
    <rect class="band" width="300" height="90" rx="9"/>
    <text class="label" x="22" y="37">TRUST + CHALLENGERS</text>
    <text class="copy" x="22" y="60">forward evidence · ablation · tuning</text>
    <text class="copy" x="22" y="78">incumbent / challenger separation</text>
  </g>
  <g transform="translate(845 370)">
    <rect class="band" width="300" height="90" rx="9"/>
    <text class="label" x="22" y="37">POINT-IN-TIME LAKES</text>
    <text class="copy" x="22" y="60">league history · play-by-play</text>
    <text class="copy" x="22" y="78">event-purged replay · no look-ahead</text>
  </g>
  <g transform="translate(845 475)">
    <rect class="band" width="300" height="90" rx="9"/>
    <text class="label" x="22" y="37">READINESS TRUTH</text>
    <text class="copy" x="22" y="60">fleet state · blockers · snapshots</text>
    <text class="copy" x="22" y="78">operational ≠ profitable ≠ authorized</text>
  </g>
  <g transform="translate(845 580)">
    <rect class="band" width="300" height="90" rx="9"/>
    <text class="label" x="22" y="37">READ-ONLY ORGANISM</text>
    <text class="copy" x="22" y="60">Overview · scopes · crypto charts</text>
    <text class="truth" x="22" y="78">GET-only · no control edge</text>
  </g>

  <g>
    <rect class="band-crypto" x="55" y="710" width="1090" height="82" rx="10"/>
    <text class="micro" x="78" y="735">CRYPTO INTELLIGENCE LANE · TWO DEDICATED TASKS + SHARED LOOPS · COUNTS ALREADY INCLUDED ABOVE</text>
    <text class="crypto" x="78" y="766">Coinbase public candles / Market Observer</text>
    <path class="wire-crypto" d="M315 762H385"/>
    <text class="crypto" x="400" y="766">CryptoPaperTwin · 5m</text>
    <path class="wire-crypto" d="M570 762H640"/>
    <text class="crypto" x="655" y="766">CryptoHorizonEvidence · 10m</text>
    <path class="wire-crypto" d="M875 762H925"/>
    <text class="crypto" x="940" y="757">Charts + scope</text>
    <text class="copy" x="940" y="776">BTC · ETH · SOL · 5 horizons</text>
  </g>

  <text class="deny" x="600" y="812" text-anchor="middle">NO LOOP, MODEL, CHART, OR DASHBOARD CAN CREATE LIVE AUTHORITY</text>
</svg>
