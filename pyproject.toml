[project]
name = "dummy"
version = "0.1.0"
requires-python = ">=3.11"
# Floor AND ceiling on every runtime dependency: floors state what the code
# uses, ceilings stop an unattended `pip install -U` from pulling a major
# release through the paper runtime. Ceilings are the next major above the
# version this box runs (0.x projects are capped at <1, where their own
# breaking changes land). Raise a ceiling deliberately, after the suite passes.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "websockets>=12.0,<17",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1.0,<2",
    "cryptography>=42.0,<50",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.21,<0.16",
    "mypy",
    "hypothesis>=6.156,<7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "pip-audit>=2.9,<3",
    "pip-licenses>=5,<6",
]
analytics = ["river>=0.25,<0.26"]
optimizer = ["ortools>=9.15,<10"]
research = ["polars>=1.42,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# This subtree is a hash-pinned copy of Blunder and must remain byte-identical.
"core/inherited_blunder/**/*.py" = ["F401"]
# Executable scripts insert the repository root into sys.path before project imports.
"scripts/*.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dummy*", "core*", "kalshi*", "live_firewall*", "compliance*", "forecasting*", "strategies*", "risk*", "repo_harvester*", "adapters*", "proof*", "model_router*", "predator_mesh*", "calibration*", "autonomy*"]

[tool.setuptools.package-data]
autonomy = ["dashboard_assets/vendor/lightweight-charts/5.2.0/*"]
