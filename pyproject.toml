[project]
name = "dummy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.5,<3",
    "ruff",
    "mypy",
    "hypothesis>=6.156,<7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]
analytics = ["river>=0.25,<0.26"]
optimizer = ["ortools>=9.15,<10"]
research = ["polars>=1.42,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Archived milestone snapshots preserve their historical import/bootstrap layout.
"archive/**/*.py" = ["E402"]
# This subtree is a hash-pinned copy of Blunder and must remain byte-identical.
"core/inherited_blunder/**/*.py" = ["F401"]
# Executable scripts insert the repository root into sys.path before project imports.
"scripts/*.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "kalshi*", "live_firewall*", "compliance*", "forecasting*", "strategies*", "risk*", "repo_harvester*", "dashboard*", "services*", "adapters*", "proof*", "execution*", "model_router*", "predator_mesh*", "calibration*", "autonomy*", "archive*"]
